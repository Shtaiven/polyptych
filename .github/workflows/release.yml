name: Release

# Build x86_64 and aarch64 tarballs, .debs and .rpms on a version tag push and
# attach them to the GitHub release. Tag with e.g.
# `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write          # needed to create the release and upload assets

jobs:
  build:
    strategy:
      matrix:
        include:
          # 22.04 for an older glibc, so the binary runs on more distros.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version consistency
        # The tag is the released version and Cargo.toml is the source of
        # truth, so the release fails here instead of shipping a mismatch.
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build tarball, .deb and .rpm
        run: packaging/build-packages.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: polyptych-${{ matrix.arch }}
          path: packaging/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
